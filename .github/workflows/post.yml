name: Instagram 자동 게시

on:
  schedule:
    # UTC 기준. 한국시간 08:57 / 12:27 / 20:57 (출근·점심·저녁 피크)
    - cron: "57 23 * * *"
    - cron: "27 3 * * *"
    - cron: "57 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "게시하지 않고 이미지만 생성"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 한국어 폰트 다운로드
        run: |
          mkdir -p fonts
          curl -sSL -o fonts/NotoSansKR.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf"

      - name: 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST || 'graph.facebook.com' }}
          IMAGE_HOST: ${{ vars.IMAGE_HOST || 'imgbb' }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE }}
          FONT_PATH: fonts/NotoSansKR.ttf
        run: python -m viralgram ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: 게시 이력 저장
        if: success() && !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted.json
          git diff --cached --quiet || (git commit -m "chore: 게시 이력 업데이트" && git push)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cards-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
