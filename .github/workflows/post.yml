name: Instagram 자동 게시

on:
  schedule:
    # UTC 기준. 한국시간 12:27 / 20:57 (점심·저녁 피크)
    - cron: "27 3 * * *"
    - cron: "57 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "게시하지 않고 이미지만 생성"
        type: boolean
        default: false
      mode:
        description: "주제: auto(낮=이슈, 저녁=웃긴 이야기) / issue / funny"
        type: choice
        options: [auto, issue, funny]
        default: auto

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 한국어 폰트 다운로드
        run: |
          mkdir -p fonts
          curl -sSL -o fonts/NotoSansKR.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf"

      - name: 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          # 인스타 서버가 imgbb(i.ibb.co) 이미지를 못 받아서, 공개 저장소의 images 브랜치에 올려 raw 주소를 쓴다
          IMAGE_HOST: ${{ vars.IMAGE_HOST || 'github' }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # AI 이미지 생성 (없으면 무료 사진으로 대체)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE }}
          # 깃허브 스케줄이 몇 시간씩 늦게 도는 경우가 있어 시각이 아니라 '어느 스케줄로 켜졌는지'로 주제를 정한다
          POST_MODE: ${{ inputs.mode || (github.event.schedule == '57 11 * * *' && 'funny') || (github.event.schedule == '27 3 * * *' && 'issue') || 'auto' }}
          FONT_PATH: fonts/NotoSansKR.ttf
          # 웹 검색으로 기사 실제 내용 파악 (끄면 제목만 보고 써서 썸네일이 모호해짐). 끄려면 Variables 에 WEB_RESEARCH=false
          WEB_RESEARCH: ${{ vars.WEB_RESEARCH || 'true' }}
        run: python -m viralgram ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: 게시 이력 저장
        if: success() && !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted.json
          git diff --cached --quiet || (git commit -m "chore: 게시 이력 업데이트" && git push)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cards-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
